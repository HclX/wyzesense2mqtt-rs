[package]
name = "wyzesense2mqtt-rs"
version = "0.1.3"
edition = "2024"
default-run = "wyzesense2mqtt-rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
binrw = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
async-trait = "0.1"
rumqttc = "0.24"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tracing-appender = "0.2.5"
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
# OpenWyzeSense host tools: dongle backup, flash and restore. Keep the tag in
# step with firmware::RELEASE_VERSION.
ows-host = { git = "https://github.com/HclX/openwyzesense", tag = "v0.2.2" }

[dev-dependencies]
crc32fast = "1"
ows-host = { git = "https://github.com/HclX/openwyzesense", tag = "v0.2.2", features = ["sim"] }
